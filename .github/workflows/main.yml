name: Build Agent and Admin APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts

      # --- 1. AGENT APK ---
      - name: Build Agent APK
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bhachat.agent",
            "appName": "Bhachat Agent",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cd ..
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/bhachat-agent.apk

      # --- 2. ADMIN APK ---
      - name: Build Admin APK
        run: |
          rm -rf android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bhachat.admin",
            "appName": "Bhachat Admin",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/bhachat-admin.apk

      - name: Upload Agent & Admin APKs
        uses: actions/upload-artifact@v4
        with:
          name: agent-and-admin-apks
          path: apks/*.apk
