name: Build Single App APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts

      - name: Build APK
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bhachat.app",
            "appName": "Bhachat",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          cat << 'EOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cd ..
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/bhachat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhachat-apk
          path: apks/*.apk
